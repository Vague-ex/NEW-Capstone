<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Arial, sans-serif" font-size="12">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9d9d9"/>
      <stop offset="100%" stop-color="#a6a6a6"/>
    </linearGradient>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
  </defs>

  <!-- ============ CLOUD DATABASE (top-left) ============ -->
  <g id="cloud-db">
    <!-- DB cylinder -->
    <ellipse cx="120" cy="130" rx="60" ry="15" fill="url(#dbGrad)" stroke="#555" stroke-width="1.5"/>
    <rect x="60" y="130" width="120" height="80" fill="url(#dbGrad)" stroke="#555" stroke-width="1.5"/>
    <ellipse cx="120" cy="210" rx="60" ry="15" fill="url(#dbGrad)" stroke="#555" stroke-width="1.5"/>
    <ellipse cx="120" cy="130" rx="60" ry="15" fill="none" stroke="#555" stroke-width="1.5"/>
    <!-- Small cloud above DB -->
    <path d="M 70 90 Q 60 70 80 70 Q 85 55 105 60 Q 120 50 135 65 Q 160 60 160 80 Q 175 85 165 100 L 75 100 Q 60 100 70 90 Z"
          fill="#e8e8e8" stroke="#555" stroke-width="1.2"/>
    <text x="120" y="245" text-anchor="middle" font-size="11" font-weight="bold">Cloud Database</text>
    <text x="120" y="260" text-anchor="middle" font-size="10">(Supabase PostgreSQL)</text>
  </g>

  <!-- ============ CENTRAL SYSTEM ============ -->
  <g id="system">
    <!-- Server/monitor illustration -->
    <rect x="540" y="150" width="160" height="110" rx="8" fill="url(#sysGrad)" stroke="#333" stroke-width="2"/>
    <rect x="555" y="165" width="130" height="70" fill="#1a1a1a" stroke="#333"/>
    <!-- Gear-like detail -->
    <circle cx="620" cy="200" r="18" fill="none" stroke="#888" stroke-width="2"/>
    <circle cx="620" cy="200" r="6" fill="#888"/>
    <rect x="595" y="240" width="50" height="6" fill="#666"/>
    <rect x="580" y="260" width="80" height="10" rx="2" fill="#999" stroke="#555"/>
    <text x="620" y="295" text-anchor="middle" font-size="12" font-weight="bold">Graduate Tracer System with</text>
    <text x="620" y="310" text-anchor="middle" font-size="12" font-weight="bold">Predictive Employability</text>
    <text x="620" y="325" text-anchor="middle" font-size="12" font-weight="bold">Trend Analysis</text>
  </g>

  <!-- ============ ADMIN PC (top-right) ============ -->
  <g id="admin-pc">
    <!-- Monitor -->
    <rect x="980" y="150" width="110" height="75" rx="4" fill="#e0e0e0" stroke="#444" stroke-width="1.5"/>
    <rect x="990" y="160" width="90" height="55" fill="#3a6db5"/>
    <rect x="1020" y="225" width="30" height="10" fill="#bbb" stroke="#444"/>
    <rect x="1005" y="235" width="60" height="6" rx="2" fill="#aaa" stroke="#444"/>
    <text x="1035" y="260" text-anchor="middle" font-size="11" font-weight="bold">PC</text>
  </g>

  <!-- ============ BSIS FACULTY (top-right person) ============ -->
  <g id="faculty">
    <!-- Person silhouette -->
    <circle cx="1230" cy="160" r="18" fill="#333"/>
    <path d="M 1200 230 Q 1200 195 1230 195 Q 1260 195 1260 230 L 1260 250 L 1200 250 Z" fill="#333"/>
    <text x="1230" y="275" text-anchor="middle" font-size="11" font-weight="bold">BSIS Faculty</text>
    <text x="1230" y="290" text-anchor="middle" font-size="10">(Admin)</text>
  </g>

  <!-- ============ INTERNET CLOUD ============ -->
  <g id="internet">
    <path d="M 580 540 Q 555 510 590 505 Q 595 480 630 485 Q 650 465 680 480 Q 715 475 720 505 Q 755 510 740 540 Q 745 565 710 565 L 600 565 Q 565 565 580 540 Z"
          fill="#f0f4ff" stroke="#5a7fc0" stroke-width="1.5"/>
    <text x="655" y="535" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a9a">Internet</text>
  </g>

  <!-- ============ ALUMNI PC (bottom-left) ============ -->
  <g id="alumni-pc">
    <rect x="280" y="680" width="110" height="75" rx="4" fill="#e0e0e0" stroke="#444" stroke-width="1.5"/>
    <rect x="290" y="690" width="90" height="55" fill="#3a6db5"/>
    <rect x="320" y="755" width="30" height="10" fill="#bbb" stroke="#444"/>
    <rect x="305" y="765" width="60" height="6" rx="2" fill="#aaa" stroke="#444"/>
    <text x="335" y="790" text-anchor="middle" font-size="11" font-weight="bold">PC</text>
  </g>

  <!-- ============ GRADUATE/ALUMNI person ============ -->
  <g id="alumni">
    <circle cx="170" cy="710" r="18" fill="#333"/>
    <path d="M 140 780 Q 140 745 170 745 Q 200 745 200 780 L 200 800 L 140 800 Z" fill="#333"/>
    <text x="170" y="825" text-anchor="middle" font-size="11" font-weight="bold">Graduate</text>
    <text x="170" y="840" text-anchor="middle" font-size="10">(Alumni)</text>
  </g>

  <!-- ============ EMPLOYER PC (bottom-right) ============ -->
  <g id="employer-pc">
    <rect x="920" y="680" width="110" height="75" rx="4" fill="#e0e0e0" stroke="#444" stroke-width="1.5"/>
    <rect x="930" y="690" width="90" height="55" fill="#3a6db5"/>
    <rect x="960" y="755" width="30" height="10" fill="#bbb" stroke="#444"/>
    <rect x="945" y="765" width="60" height="6" rx="2" fill="#aaa" stroke="#444"/>
    <text x="975" y="790" text-anchor="middle" font-size="11" font-weight="bold">PC</text>
  </g>

  <!-- ============ EMPLOYER person ============ -->
  <g id="employer">
    <circle cx="1140" cy="710" r="18" fill="#333"/>
    <path d="M 1110 780 Q 1110 745 1140 745 Q 1170 745 1170 780 L 1170 800 L 1110 800 Z" fill="#333"/>
    <text x="1140" y="825" text-anchor="middle" font-size="11" font-weight="bold">Employer</text>
  </g>

  <!-- ================= ARROWS ================= -->

  <!-- DB <-> System -->
  <line x1="185" y1="155" x2="535" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="155" font-size="11" fill="#222">Generate Reports</text>

  <line x1="535" y1="220" x2="185" y2="195" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="235" font-size="11" fill="#222">Store / Retrieve Data</text>

  <!-- System <-> Admin PC -->
  <line x1="705" y1="180" x2="975" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="775" y="172" font-size="11" fill="#222">Retrieve Data</text>

  <line x1="975" y1="210" x2="705" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="225" font-size="11" fill="#222">Updated Data</text>

  <!-- Admin PC <-> Faculty -->
  <line x1="1095" y1="170" x2="1205" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1100" y="162" font-size="10" fill="#222">Analytics / Reports</text>

  <line x1="1095" y1="190" x2="1205" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1100" y="207" font-size="10" fill="#222">Verified Graduate List</text>

  <line x1="1205" y1="215" x2="1095" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1100" y="232" font-size="10" fill="#222">Update Data / Upload</text>

  <!-- System <-> Internet -->
  <line x1="600" y1="335" x2="630" y2="475" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="410" font-size="11" fill="#222">Receive Data</text>

  <line x1="680" y1="475" x2="650" y2="335" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="410" font-size="11" fill="#222">Submit Records</text>

  <!-- Internet <-> Alumni PC -->
  <line x1="595" y1="555" x2="385" y2="685" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="595" font-size="11" fill="#222">Receive Data</text>

  <line x1="395" y1="700" x2="615" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="650" font-size="11" fill="#222">Submit Records</text>

  <!-- Internet <-> Employer PC -->
  <line x1="715" y1="555" x2="925" y2="685" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="595" font-size="11" fill="#222">Receive Data</text>

  <line x1="915" y1="700" x2="695" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="830" y="650" font-size="11" fill="#222">Submit Records</text>

  <!-- Alumni PC <-> Alumni -->
  <line x1="275" y1="720" x2="200" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="712" font-size="10" fill="#222">Account Data</text>

  <line x1="200" y1="745" x2="275" y2="745" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="762" font-size="10" fill="#222">Encode Data</text>

  <!-- Employer PC <-> Employer -->
  <line x1="1035" y1="720" x2="1110" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1040" y="712" font-size="10" fill="#222">Account Data</text>

  <line x1="1110" y1="745" x2="1035" y2="745" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1040" y="762" font-size="10" fill="#222">Encode Data</text>

  <!-- ============ LEGEND ============ -->
  <g id="legend" transform="translate(40, 880)">
    <rect x="0" y="0" width="500" height="90" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="10" y="18" font-size="11" font-weight="bold">Legend:</text>
    <text x="10" y="35" font-size="10">• Admin (BSIS Faculty): on-site PC, direct connection to system</text>
    <text x="10" y="50" font-size="10">• Alumni &amp; Employer: remote users, access system via internet</text>
    <text x="10" y="65" font-size="10">• Encode Data = data entered by user (registration, survey, ratings)</text>
    <text x="10" y="80" font-size="10">• Account Data = personalized response (dashboard, lists, status)</text>
  </g>

</svg>
