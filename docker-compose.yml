# Graduate Tracer System — local and VPS deployment.
#
#   docker compose up --build
#   frontend  http://localhost:3000
#   backend   http://localhost:8000
#
# The database stays external (Supabase). Nothing here runs Postgres, so
# there is no database volume to back up. The only volumes are Caddy's
# certificate store, which regenerates itself if lost.
#
# On the VPS, add TLS with:  docker compose --profile prod up -d --build

services:
  backend:
    build:
      context: ./backend
      args:
        # Adds the server-side face engine and bakes its model pack into the
        # image. Leave false unless FACE_ENGINE=insightface, since the wheels
        # and the ~125MB pack are dead weight otherwise.
        #   INSTALL_INSIGHTFACE=true docker compose --profile prod up -d --build
        INSTALL_INSIGHTFACE: ${INSTALL_INSIGHTFACE:-false}
        INSIGHTFACE_MODEL_PACK: ${INSIGHTFACE_MODEL_PACK:-buffalo_s}
    image: gradtracer-backend
    restart: unless-stopped
    env_file:
      # Secrets live here, never in the image. Copy backend/.env.example.
      - ./backend/.env
    environment:
      # Explicit rather than inherited: a production container must never
      # start in debug mode, which would serve tracebacks containing the
      # database credentials to anyone who triggers an error.
      DEBUG: "False"
      # Sizing follows the engine. face-api costs the server nothing, so 2
      # workers is right. InsightFace gives each worker its own ONNX session at
      # roughly 0.8-1.5 GB, and two of those on this 4 GB box alongside Next.js
      # and Caddy get OOM-killed -- so 1 worker with threads, which the
      # Supabase-bound workload does not suffer from.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-1}
    ports:
      # Loopback only: on the VPS the sole public listener is Caddy.
      # Publishing 0.0.0.0:8000 would expose gunicorn over plain HTTP,
      # bypassing TLS entirely.
      - "127.0.0.1:8000:8000"
    volumes:
      # Trained model artifacts, so the model can be retrained and swapped
      # without rebuilding the image.
      - ./backend/ml/models:/app/ml/models

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is baked in at BUILD time. Point this at the public
        # backend URL before building for a real deployment — changing it
        # afterwards requires a rebuild, not just a restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: gradtracer-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  # Only starts with --profile prod, so local development never tries to
  # obtain a certificate for a domain that does not resolve to this machine.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set both in the project .env beside docker-compose.yml.
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. gradtracer.tech}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for TLS certificate notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates MUST persist. Without this volume every restart requests
      # a fresh certificate and Let's Encrypt rate-limits you (5 duplicate
      # certificates per week), locking the site out of HTTPS for days.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
